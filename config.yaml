        expr: foxess_inv1_total_charge_energy * 0.1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: Battery Charge Energy daily
        unique_id: foxess_inv1_daily_charge_energy
        expr: foxess_inv1_daily_charge_energy * 0.1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: Battery Discharge Energy total
        unique_id: foxess_inv1_total_discharge_energy
        expr: foxess_inv1_total_discharge_energy * 0.1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: Battery Discharge Energy daily
        unique_id: foxess_inv1_daily_discharge_energy
        expr: foxess_inv1_daily_discharge_energy * 0.1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: Meter Feed-in Energy total
        unique_id: foxess_sm1_total_feedin_energy
        expr: foxess_sm1_total_feedin_energy * 0.1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: Meter Feed-in Energy daily
        unique_id: foxess_sm1_daily_feedin_energy
        expr: foxess_sm1_daily_feedin_energy * 0.1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: Meter Consumption Energy total
        unique_id: foxess_sm1_total_consumption_energy
        expr: foxess_sm1_total_consumption_energy * 0.1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: Meter Consumption Energy daily
        unique_id: foxess_sm1_daily_consumption_energy
        expr: foxess_sm1_daily_consumption_energy * 0.1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: Meter Output Energy total
        unique_id: foxess_sm1_total_output_energy
        expr: foxess_sm1_total_output_energy * 0.1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: Meter Output Energy daily
        unique_id: foxess_sm1_daily_output_energy
        expr: foxess_sm1_daily_output_energy * 0.1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: Meter Input Energy total
        unique_id: foxess_sm1_total_input_energy
        expr: foxess_sm1_total_input_energy * 0.1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: Meter Input Energy daily
        unique_id: foxess_sm1_daily_input_energy
        expr: foxess_sm1_daily_input_energy * 0.1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: Inv Load Energy total
        unique_id: foxess_inv1_total_load_energy
        expr: foxess_inv1_total_load_energy * 0.1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: Inv Load Energy daily
        unique_id: foxess_inv1_daily_load_energy
        expr: foxess_inv1_daily_load_energy * 0.1
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing

 #Templates enable math operations against states/values to give us better data
template:
  - sensor:
    - name: "Battery Discharge"
      unique_id: foxess_inv1_battery_discharge
      device_class: "power"
      unit_of_measurement: "W"
      state: >
          {% if (states('sensor.battery_discharge_power') | float(default=0) ) > 0 %}
          {{ states('sensor.battery_discharge_power') | float(default=0) * 1 }}
          {% else %}
          0 
          {% endif %}
    - name: "Battery Charge"
      unique_id: foxess_inv1_battery_charge
      device_class: "power"
      unit_of_measurement: "W"
      state: >
          {% if (states('sensor.battery_discharge_power') | float(default=0) ) < 0 %}
          {{ states('sensor.battery_discharge_power') | float(default=0) * -1 }}
          {% else %}
          0 
          {% endif %}
    - name: "Feed In Power"
      unique_id: foxess_inv1_feed_in_power
      device_class: "power"
      unit_of_measurement: "W"
      state: >
          {% if (states('sensor.meter_power_total') | float(default=0) ) > 0 %}
          {{ states('sensor.meter_power_total') | float(default=0) * 1 }}
          {% else %}
          0 
          {% endif %}
    - name: "Grid Consumption"
      unique_id: foxess_inv1_grid_consumption
      device_class: "power"
      unit_of_measurement: "W"
      state: >
          {% if (states('sensor.meter_power_total') | float(default=0) ) < 0 %}
          {{ states('sensor.meter_power_total') | float(default=0) * -1 }}
          {% else %}
          0 
          {% endif %}
    - name: "Compressor Energy Consumption Daily kWh"
      unique_id: compressor_energy_consumption_daily_kwh
      device_class: "energy"
      unit_of_measurement: "kWh"
      state: >
        {{ states('sensor.compressor_energy_consumption_daily') }}
    - name: "House Generic Power" # What does the house consume right now without heat pump
      unique_id: house_generic_power
      device_class: "power"
      unit_of_measurement: "W"
      state: >
        {{ (states('sensor.house_consumption_power') | float(default=0)) - (states('sensor.boiler_hpcurrpower') | float(default=0)) }}
    - name: "House Consumption Energy Daily" # What did the whole house consume today until now
      unique_id: house_consumption_energy_daily
      device_class: "energy"
      unit_of_measurement: "kWh"
      state: >
        {{ (states('sensor.meter_consumption_energy_daily') | float(default=0)) - (states('sensor.meter_feed_in_energy_daily') | float(default=0)) + (states('sensor.pv_energy_daily') | float(default=0)) + (states('sensor.battery_discharge_energy_daily') | float(default=0)) - (states('sensor.battery_charge_energy_daily') | float(default=0)) }}
    - name: "House Generic Consumption Energy Daily" # What did the house without heat pump consume today until now
      unique_id: house_generic_consumption_energy_daily
      device_class: "energy"
      unit_of_measurement: "kWh"
      state: >
        {{ (states('sensor.house_consumption_energy_daily') | float(default=0)) - (states('sensor.compressor_energy_consumption_daily') | float(default=0)) }}
    - name: "Grid Energy Daily" # How much energy did we buy or sell to grid today
      unique_id: grid_energy_daily
      device_class: "energy"
      unit_of_measurement: "kWh"
      state: >
        {{ (states('sensor.meter_consumption_energy_daily') | float(default=0)) - (states('sensor.meter_feed_in_energy_daily') | float(default=0)) }}

utility_meter:
  compressor_energy_consumption_daily:
    unique_id: compressor_energy_consumption_daily
    source: sensor.boiler_metercomp
    cycle: daily
