
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

modbus:
- name: HA-FoxESS-Modbus-LAN
  type: tcp
  host: 192.168.178.36
  port: 502
  delay: 5
  timeout: 5
  close_comm_on_error: true
  retry_on_empty: true
  retries: 5

  sensors:
    - name: "PV1-Voltage"
      unique_id: foxess_inv1_pv1_voltage
      scan_interval: 15
      slave: 247
      address: 31000
      state_class: measurement
      unit_of_measurement: "V"
      data_type: int16
      scale: 0.1
      precision: 1
      input_type: holding
      device_class: voltage
    - name: "PV1-Current"
      unique_id: foxess_inv1_pv1_current
      scan_interval: 15
      slave: 247
      address: 31001
      state_class: measurement
      unit_of_measurement: "A"
      data_type: int16
      scale: 0.1
      precision: 1
      input_type: holding
      device_class: current
    - name: "PV1-Power"
      unique_id: foxess_inv1_pv1_power
      scan_interval: 15
      slave: 247
      address: 31002
      state_class: measurement
      unit_of_measurement: "W"
      data_type: int16
      scale: 1
      precision: 0
      input_type: holding
      device_class: power
    - name: "PV2-Voltage"
      unique_id: foxess_inv1_pv2_voltage
      scan_interval: 15
      slave: 247
      address: 31003
      state_class: measurement
      unit_of_measurement: "V"
      data_type: int16
      scale: 0.1
      precision: 1
      input_type: holding
      device_class: voltage
    - name: "PV2-Current"
      unique_id: foxess_inv1_pv2_current
      scan_interval: 15
      slave: 247
      address: 31004
      state_class: measurement
      unit_of_measurement: "A"
      data_type: int16
      scale: 0.1
      precision: 1
      input_type: holding
      device_class: current
    - name: "PV2-Power"
      unique_id: foxess_inv1_pv2_power
      scan_interval: 15
      slave: 247
      address: 31005
      state_class: measurement
      unit_of_measurement: "W"
      data_type: int16
      scale: 1
      precision: 0
      input_type: holding
      device_class: power
    #section main grid output
    - name: "Grid Voltage R" # Grid Voltage formerly named: "Volt L1"
      unique_id: foxess_inv1_grid_voltage_R
      scan_interval: 15
      slave: 247
      address: 31006
      state_class: measurement
      unit_of_measurement: "V"
      data_type: int16
      precision: 2
      scale: 0.1
      input_type: holding
      device_class: voltage
    - name: "Grid Voltage S" # Grid Voltage formerly named: "Volt L2"
